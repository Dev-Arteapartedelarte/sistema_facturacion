<!-- core/templates/core/error.html -->
{% extends 'core/base.html' %}

{% block title %}Error - Sistema de Facturación{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2 text-danger"><i class="bi bi-exclamation-triangle"></i> Error</h1>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card border-danger">
            <div class="card-body text-center py-5">
                <i class="bi bi-shield-exclamation" style="font-size: 4rem; color: #dc3545;"></i>
                <h3 class="mt-3">{{ mensaje|default:"Ha ocurrido un error inesperado" }}</h3>
                <p class="text-muted">Por favor, contacte al administrador del sistema.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3">
                    <i class="bi bi-house"></i> Volver al inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
