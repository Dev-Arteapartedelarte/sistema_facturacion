<!-- core/templates/core/500.html -->
{% extends 'core/base.html' %}

{% block title %}Error interno - Sistema de Facturación{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2 text-danger"><i class="bi bi-bug"></i> 500 - Error interno del servidor</h1>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card border-danger">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 4rem; color: #dc3545;"></i>
                <h3 class="mt-3">Algo salió mal</h3>
                <p class="text-muted">El sistema ha encontrado un error inesperado. Ya hemos sido notificados.</p>
                <p class="text-muted small">Por favor, intenta nuevamente más tarde.</p>
                <a href="{% url 'dashboard' %}"
