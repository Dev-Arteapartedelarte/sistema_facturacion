<!-- core/templates/core/404.html -->
{% extends 'core/base.html' %}

{% block title %}Página no encontrada - Sistema de Facturación{% endblock %}

{% block content %}
<div class="pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2 text-warning"><i class="bi bi-file-earmark-x"></i> 404 - Página no encontrada</h1>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card border-warning">
            <div class="card-body text-center py-5">
                <i class="bi bi-question-circle" style="font-size: 4rem; color: #ffc107;"></i>
                <h3 class="mt-3">La página que buscas no existe</h3>
                <p class="text-muted">La URL solicitada no se encuentra disponible en el sistema.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3">
                    <i class="bi bi-house"></i> Volver al inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
