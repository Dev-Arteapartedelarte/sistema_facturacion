<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Facturación{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.8);
        }
        .sidebar .nav-link:hover {
            color: white;
            background: rgba(255,255,255,.1);
        }
        .sidebar .nav-link.active {
            color: white;
            background: rgba(255,255,255,.2);
        }
        .sidebar .nav-link i {
            margin-right: 10px;
        }
        .main-content {
            background: #f8f9fa;
            min-height: 100vh;
        }
        .card-stats {
            border-left: 4px solid;
        }
        .card-stats.primary { border-color: #0d6efd; }
        .card-stats.success { border-color: #198754; }
        .card-stats.warning { border-color: #ffc107; }
        .card-stats.danger { border-color: #dc3545; }
        .navbar-brand {
            font-weight: bold;
        }
        .badge-estado {
            font-size: 0.7rem;
        }
        .logout-btn {
            color: rgba(255,255,255,.8);
            text-decoration: none;
        }
        .logout-btn:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block sidebar p-0">
                <div class="position-sticky pt-3">
                    <div class="p-3">
                        <h4><i class="bi bi-receipt"></i> Facturación</h4>
                        <small class="text-muted">{{ empresa_actual.razon_social|default:"Sin empresa" }}</small>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/">
                                <i class="bi bi-gear"></i> Admin
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'balance_general' %}active{% endif %}" href="{% url 'balance_general' %}">
                                <i class="bi bi-file-earmark-text"></i> Balance
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'lista_dte' %}">
                                <i class="bi bi-receipt-cutoff"></i> Documentos DTE
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/api/dte/documentos/">
                                <i class="bi bi-code-square"></i> API DTE
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'lista_asientos' %}active{% endif %}" href="{% url 'lista_asientos' %}">
                                <i class="bi bi-journal-text"></i> Asientos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/api/contabilidad/asientos/">
                                <i class="bi bi-code-square"></i> API Contabilidad
                            </a>
                        </li>
                    </ul>
                    <hr class="border-light">
                    <div class="p-3">
                        <small class="text-muted">
                            <i class="bi bi-person-circle"></i> {{ user.username }}
                        </small>
                        <br>
                        <!-- Logout con POST -->
                        <form action="{% url 'logout' %}" method="post" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link text-light small p-0 border-0" style="text-decoration: none;">
                                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                            </button>
                        </form>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 ms-sm-auto px-md-4 main-content">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
